<!doctype html>
<html lang="en" data-app="nest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FBF7F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nest">
<title>Nest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<style>html,body{background:#FBF7F3}@media (prefers-color-scheme:dark){html,body{background:#17141A}}</style>
</head>
<body>
<div id="update" class="banner" hidden><span>A new version is ready.</span><button class="btn primary" id="update-btn" data-act="update">Update</button></div>
<div id="err" class="banner" role="alert" hidden><span>Something went wrong. Everything is saved on this phone.</span><button class="btn" data-act="reload">Reload</button></div>
<main id="main" tabindex="0"><p class="muted" style="padding:40px 0">Loading…</p></main>
<nav id="nav" hidden aria-label="Sections">
  <button data-act="tab" data-tab="today"><span aria-hidden="true">☀️</span>Today</button>
  <button data-act="tab" data-tab="home"><span aria-hidden="true">🏡</span>Home</button>
  <button data-act="tab" data-tab="meals"><span aria-hidden="true">🍲</span>Meals</button>
  <button data-act="tab" data-tab="us"><span aria-hidden="true">💬</span>Us</button>
  <button data-act="tab" data-tab="more"><span aria-hidden="true">☰</span>More</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" hidden></div>
<input type="file" id="restorein" accept=".json,application/json" hidden aria-hidden="true" tabindex="-1">
<script type="module" src="app.js"></script>
<div id="stagingbadge" role="note" aria-label="Staging build, not the live app" style="position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:99999;background:#b00020;color:#fff;font:700 13px/1 system-ui;padding:5px 12px;border-radius:0 0 8px 8px;pointer-events:none">STAGING · QA only</div></body>
</html>
